# Scale on the queue inside each vLLM replica.
#
# vllm:num_requests_waiting only rises once a replica's batch is full, so this
# policy reacts late by construction: by the time it fires, requests are
# already queueing. No `behavior` block: the controller's built-in rules apply
# (at most double per sync, 5 minute scale-down stabilisation).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-queue-depth
  namespace: inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric:
          name: vllm:num_requests_waiting
        target:
          type: AverageValue
          averageValue: "5"
