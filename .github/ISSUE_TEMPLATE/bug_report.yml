name: Bug report
description: Something is wrong, or deviates from the Kubernetes or KEDA documentation
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The command line, the policy manifest, the replica model, and a small
        trace (or a `trace synth` command) that shows the problem. Remove
        anything confidential.
      render: shell
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Documentation reference
      description: If the autoscaler logic deviates from the Kubernetes or KEDA docs, link the section.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `scale-backtest version`, and your OS and architecture.
    validations:
      required: true
